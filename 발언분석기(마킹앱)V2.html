<!DOCTYPE html>
<html lang="ko" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>자유와혁신당 - 발언 분석기</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- html2pdf.js for Client-Side PDF Generation -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        body { font-family: 'Pretendard', sans-serif; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #f1f5f9; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        .highlight-red { background-color: rgba(239, 68, 68, 0.3); border-bottom: 2px solid #ef4444; }
        .highlight-yellow { background-color: rgba(234, 179, 8, 0.3); border-bottom: 2px solid #eab308; }
        .highlight-blue { background-color: rgba(59, 130, 246, 0.3); border-bottom: 2px solid #3b82f6; }
    </style>
</head>
<body class="h-full bg-slate-900 text-slate-100 flex flex-col overflow-hidden">

    <!-- Header -->
    <header class="bg-slate-800 border-b border-slate-700 px-6 py-4 flex items-center justify-between shrink-0 shadow-md">
        <div class="flex items-center space-x-3">
            <div class="bg-indigo-600 text-white p-2.5 rounded-xl shadow-lg flex items-center justify-center">
                <i class="fa-solid fa-highlighter text-lg"></i>
            </div>
            <div>
                <div class="flex items-center space-x-2">
                    <span class="text-xs font-semibold px-2 py-0.5 bg-indigo-500/20 text-indigo-400 rounded-full border border-indigo-500/30">자유와혁신당 정보분석위원회</span>
                </div>
                <h1 class="text-xl font-bold tracking-tight text-white mt-0.5">발언 분석기 <span class="text-xs font-normal text-slate-400">v3.1 (PDF 다운로드 추가)</span></h1>
            </div>
        </div>
        
        <div class="flex items-center space-x-3">
            <button onclick="app.loadSampleData()" class="px-4 py-2 bg-slate-700 hover:bg-slate-600 text-slate-200 text-sm font-medium rounded-lg transition-colors flex items-center space-x-2 border border-slate-600">
                <i class="fa-solid fa-file-lines"></i>
                <span>샘플 대본 불러오기</span>
            </button>
            <label class="px-4 py-2 bg-indigo-600 hover:bg-indigo-500 text-white text-sm font-semibold rounded-lg transition-colors cursor-pointer flex items-center space-x-2 shadow-lg shadow-indigo-600/30">
                <i class="fa-solid fa-folder-open"></i>
                <span>텍스트 파일 업로드</span>
                <input type="file" id="fileInput" accept=".txt,.text" class="hidden" onchange="app.handleFileUpload(event)">
            </label>
        </div>
    </header>

    <!-- Main Content Area: 2-Column Split View -->
    <main class="flex-1 flex overflow-hidden p-4 gap-4 bg-slate-950">

        <!-- Left Pane: Pure Original Text Viewer -->
        <section class="w-1/2 bg-slate-900 border border-slate-800 rounded-2xl flex flex-col shadow-xl overflow-hidden">
            <div class="bg-slate-800/80 border-b border-slate-700/80 px-5 py-3.5 flex items-center justify-between shrink-0">
                <div class="flex items-center space-x-2">
                    <i class="fa-solid fa-align-left text-indigo-400"></i>
                    <h2 class="font-semibold text-white text-sm tracking-wide">좌측: 원본 텍스트 뷰어</h2>
                </div>
                <span id="leftMeta" class="text-xs text-slate-400 bg-slate-900 px-2.5 py-1 rounded-md border border-slate-700">대기 중...</span>
            </div>
            <div id="leftContainer" class="flex-1 overflow-y-auto p-6 whitespace-pre-wrap font-mono text-sm text-slate-300 leading-relaxed select-text">
                <div class="h-full flex flex-col items-center justify-center text-slate-500 text-center py-20 font-sans">
                    <i class="fa-solid fa-file-arrow-up text-4xl mb-3 text-slate-600"></i>
                    <p class="text-base font-medium text-slate-400">분석할 텍스트 파일을 불러오거나 샘플을 로드하세요.</p>
                    <p class="text-xs text-slate-500 mt-1">우측 편집창에서 마우스로 텍스트를 드래그하여 마킹할 수 있습니다.</p>
                </div>
            </div>
        </section>

        <!-- Right Pane: Interactive Editing & Marking Pane -->
        <section class="w-1/2 bg-slate-900 border border-slate-800 rounded-2xl flex flex-col shadow-xl overflow-hidden">
            <div class="bg-slate-800/80 border-b border-slate-700/80 px-5 py-3.5 flex items-center justify-between shrink-0">
                <div class="flex items-center space-x-2">
                    <i class="fa-solid fa-highlighter text-emerald-400"></i>
                    <h2 class="font-semibold text-white text-sm tracking-wide">우측: 구간 선택 및 마킹 편집창</h2>
                </div>
                <div class="flex items-center space-x-2">
                    <div id="toolbar" class="hidden items-center space-x-1.5 bg-slate-800 px-2 py-1 rounded-lg border border-slate-700">
                        <span class="text-xs text-slate-400 mr-1">마킹:</span>
                        <button onclick="app.applyHighlight('red')" class="px-2 py-0.5 bg-red-600 hover:bg-red-500 text-white text-xs rounded font-bold shadow">중요</button>
                        <button onclick="app.applyHighlight('yellow')" class="px-2 py-0.5 bg-yellow-600 hover:bg-yellow-500 text-white text-xs rounded font-bold shadow text-slate-950">참고</button>
                        <button onclick="app.applyHighlight('blue')" class="px-2 py-0.5 bg-blue-600 hover:bg-blue-500 text-white text-xs rounded font-bold shadow">시책</button>
                        <button onclick="app.removeHighlight()" class="px-2 py-0.5 bg-slate-700 hover:bg-slate-600 text-slate-300 text-xs rounded">해제</button>
                    </div>
                    <button onclick="app.downloadReport()" class="px-3 py-1.5 bg-slate-700 hover:bg-slate-600 text-slate-200 text-xs font-semibold rounded-lg transition-colors flex items-center space-x-1.5 border border-slate-600">
                        <i class="fa-solid fa-code"></i>
                        <span>HTML 다운로드</span>
                    </button>
                    <button onclick="app.downloadPdfReport()" class="px-3 py-1.5 bg-rose-600 hover:bg-rose-500 text-white text-xs font-semibold rounded-lg transition-colors flex items-center space-x-1.5 shadow">
                        <i class="fa-solid fa-file-pdf"></i>
                        <span>PDF 다운로드</span>
                    </button>
                </div>
            </div>
            <div id="rightContainer" contenteditable="false" onmouseup="app.handleTextSelection()" class="flex-1 overflow-y-auto p-6 whitespace-pre-wrap font-mono text-sm text-slate-200 leading-relaxed focus:outline-none">
                <div class="h-full flex flex-col items-center justify-center text-slate-500 text-center py-20 font-sans">
                    <i class="fa-solid fa-pen-nib text-4xl mb-3 text-slate-600"></i>
                    <p class="text-base font-medium text-slate-400">텍스트를 불러오면 우측에서 드래그하여 마킹할 수 있습니다.</p>
                </div>
            </div>
        </section>

    </main>

    <!-- Application Logic Script -->
    <script>
        class SpeechAnalyzer {
            constructor() {
                this.rawText = "";
                this.fileName = "document.txt";
            }

            loadSampleData() {
                const sample = `[00:00] 인사이트 개요 및 당면 과제 점검
안녕하십니까, 시청자 여러분 그리고 당원 동지 여러분. 오늘 정보분석위원회 특별 보고에서는 최근 유튜브 채널 및 주요 방송에서 다뤄진 주요 정치·경제 발언들의 핵심 쟁점을 입체적으로 분석하고자 합니다. 첫 번째로 다룰 사안은 민생 경제 회복을 위한 정책적 실효성 문제입니다. 현재 여론은 단순한 구호보다 체감할 수 있는 실질적인 지원책 마련을 강력히 요구하고 있습니다.

[03:15] 핵심 쟁점 분석: 소상공인 지원 및 예산 효율성
두 번째 핵심 발언 구간입니다. 소상공인과 자영업자 지원 예산 편성과 관련하여, 야당과 여당 간의 시각차가 뚜렷하게 나타나고 있습니다. 야당 측은 전면적인 현금성 지원 확대를 주장하는 반면, 당 소속 위원회 및 전문가 집단은 구조적 개편과 디지털 전환 지원을 통한 장기 자생력 확보가 시급하다고 강조했습니다. 예산의 효율적 배분이 향후 민심을 좌우할 핵심 변수입니다.

[07:42] 향후 전략 방향 및 커뮤니케이션 제언
마지막 세 번째 구간입니다. 유튜브 여론 지형 분석 결과, 일방향적 홍보 방송보다는 시청자들과 실시간으로 소통하며 의혹을 투명하게 해명하는 라이브 콘텐츠의 영향력이 급증하고 있는 것으로 나타났습니다. 따라서 향후 당의 미디어 소통 전략은 데이터 기반의 팩트 체크와 공감대를 형성하는 스토리텔링 방식으로 전면 개편되어야 합니다. 이상으로 브리핑을 마칩니다.`;

                this.processText(sample, "샘플_유튜브_발언_분석보고.txt");
                this.showNotification("샘플 대본이 성공적으로 로드되었습니다.", "success");
            }

            handleFileUpload(event) {
                const file = event.target.files[0];
                if (!file) return;

                const reader = new FileReader();
                reader.onload = (e) => {
                    const text = e.target.result;
                    this.processText(text, file.name);
                    this.showNotification(`파일 '${file.name}'이(가) 정상적으로 로드되었습니다.`, "success");
                };
                reader.readAsText(file, "UTF-8");
            }

            processText(text, fileName) {
                this.rawText = text;
                this.fileName = fileName;
                
                document.getElementById('leftMeta').innerText = `파일명: ${fileName}`;
                
                // Set left view to clean raw text
                document.getElementById('leftContainer').innerText = text;

                // Enable editing / selection on right view
                const rightContainer = document.getElementById('rightContainer');
                rightContainer.contentEditable = "true";
                rightContainer.innerText = text;

                this.hideToolbar();
            }

            handleTextSelection() {
                const selection = window.getSelection();
                if (!selection || selection.isCollapsed || !selection.toString().trim()) {
                    return;
                }

                const rightContainer = document.getElementById('rightContainer');
                const range = selection.getRangeAt(0);

                // Ensure selection is inside right container
                if (!rightContainer.contains(range.commonAncestorContainer)) {
                    this.hideToolbar();
                    return;
                }

                // Show color toolbar
                const toolbar = document.getElementById('toolbar');
                toolbar.classList.remove('hidden');
                toolbar.classList.add('flex');
            }

            hideToolbar() {
                const toolbar = document.getElementById('toolbar');
                toolbar.classList.remove('flex');
                toolbar.classList.add('hidden');
            }

            applyHighlight(color) {
                const selection = window.getSelection();
                if (!selection || selection.isCollapsed) return;

                const range = selection.getRangeAt(0);
                const rightContainer = document.getElementById('rightContainer');
                
                if (!rightContainer.contains(range.commonAncestorContainer)) return;

                const span = document.createElement('span');
                span.className = color === 'red' ? 'highlight-red' : color === 'yellow' ? 'highlight-yellow' : 'highlight-blue';
                span.dataset.color = color;
                
                try {
                    span.appendChild(range.extractContents());
                    range.insertNode(span);
                    selection.removeAllRanges();
                    this.hideToolbar();
                    this.showNotification("선택 구간에 마킹이 적용되었습니다.", "success");
                } catch (e) {
                    console.error(e);
                }
            }

            removeHighlight() {
                const selection = window.getSelection();
                const rightContainer = document.getElementById('rightContainer');

                if (selection && !selection.isCollapsed) {
                    const range = selection.getRangeAt(0);
                    if (rightContainer.contains(range.commonAncestorContainer)) {
                        const containerElement = document.createElement('div');
                        containerElement.appendChild(range.extractContents());
                        
                        const spans = containerElement.querySelectorAll('span[data-color]');
                        spans.forEach(span => {
                            const parent = span.parentNode;
                            while (span.firstChild) {
                                parent.insertBefore(span.firstChild, span);
                            }
                            parent.removeChild(span);
                        });

                        range.insertNode(containerElement);
                        while (containerElement.firstChild) {
                            containerElement.parentNode.insertBefore(containerElement.firstChild, containerElement);
                        }
                        containerElement.parentNode.removeChild(containerElement);

                        selection.removeAllRanges();
                        this.hideToolbar();
                        this.showNotification("선택 구간의 마킹이 해제되었습니다.", "success");
                        return;
                    }
                }

                if (selection && selection.anchorNode) {
                    let container = selection.anchorNode;
                    if (container.nodeType === 3) {
                        container = container.parentNode;
                    }

                    while (container && container !== rightContainer) {
                        if (container.tagName === 'SPAN' && container.dataset.color) {
                            const parent = container.parentNode;
                            while (container.firstChild) {
                                parent.insertBefore(container.firstChild, container);
                            }
                            parent.removeChild(container);
                            rightContainer.normalize();
                            selection.removeAllRanges();
                            this.hideToolbar();
                            this.showNotification("마킹이 해제되었습니다.", "success");
                            return;
                        }
                        container = container.parentNode;
                    }
                }

                this.showNotification("해제할 마킹 구간을 선택하거나 마킹된 텍스트 위를 지정해주세요.", "error");
            }

            downloadReport() {
                if (!this.rawText) {
                    this.showNotification("다운로드할 내용이 없습니다.", "error");
                    return;
                }

                const rightContentHtml = document.getElementById('rightContainer').innerHTML;

                let docContent = `<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>자유와혁신당 - 발언 분석 보고서 (${this.fileName})</title>
    <style>
        body { font-family: 'Pretendard', sans-serif; background: #f8fafc; color: #1e293b; padding: 40px; line-height: 1.6; }
        .container { max-width: 800px; margin: 0 auto; background: #ffffff; padding: 40px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        h1 { font-size: 24px; color: #0f172a; border-bottom: 2px solid #e2e8f0; padding-bottom: 12px; margin-bottom: 24px; }
        .meta { font-size: 13px; color: #64748b; margin-bottom: 30px; }
        .content { white-space: pre-wrap; font-family: 'Pretendard', sans-serif; font-size: 15px; color: #334155; }
        .highlight-red { background-color: rgba(239, 68, 68, 0.25); border-bottom: 2px solid #ef4444; }
        .highlight-yellow { background-color: rgba(234, 179, 8, 0.25); border-bottom: 2px solid #eab308; }
        .highlight-blue { background-color: rgba(59, 130, 246, 0.25); border-bottom: 2px solid #3b82f6; }
    </style>
</head>
<body>
    <div class="container">
        <h1>[자유와혁신당] 정보분석위원회 발언 분석 보고서</h1>
        <div class="meta">원본 파일: ${this.fileName} | 생성 일시: ${new Date().toLocaleString()}</div>
        <div class="content">${rightContentHtml}</div>
    </div>
</body>
</html>`;

                const blob = new Blob([docContent], { type: 'text/html;charset=utf-8' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `발언분석보고서_${this.fileName.replace(/\.[^/.]+$/, "")}.html`;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);

                this.showNotification("HTML 문서가 성공적으로 다운로드되었습니다.", "success");
            }

            downloadPdfReport() {
                if (!this.rawText) {
                    this.showNotification("다운로드할 내용이 없습니다.", "error");
                    return;
                }

                this.showNotification("PDF 파일을 생성 중입니다... 잠시만 기다려주세요.", "success");

                // Create a clean temporary element styled for print/PDF
                const printElement = document.createElement('div');
                printElement.style.padding = '30px';
                printElement.style.background = '#ffffff';
                printElement.style.color = '#1e293b';
                printElement.style.fontFamily = "'Pretendard', sans-serif";

                const rightContentHtml = document.getElementById('rightContainer').innerHTML;

                printElement.innerHTML = `
                    <div style="border-bottom: 2px solid #0f172a; padding-bottom: 15px; margin-bottom: 20px;">
                        <h2 style="font-size: 20px; font-weight: 700; color: #0f172a; margin: 0 0 5px 0;">[자유와혁신당] 정보분석위원회 발언 분석 보고서</h2>
                        <p style="font-size: 12px; color: #64748b; margin: 0;">원본 파일: ${this.fileName} | 생성 일시: ${new Date().toLocaleString()}</p>
                    </div>
                    <div style="white-space: pre-wrap; font-size: 13px; line-height: 1.7; color: #334155;">
                        ${rightContentHtml}
                    </div>
                `;

                const opt = {
                    margin:       10,
                    filename:     `발언분석보고서_${this.fileName.replace(/\.[^/.]+$/, "")}.pdf`,
                    image:        { type: 'jpeg', quality: 0.98 },
                    html2canvas:  { scale: 2, useCORS: true, letterRendering: true },
                    jsPDF:        { unit: 'mm', format: 'a4', orientation: 'portrait' }
                };

                html2pdf().from(printElement).set(opt).save().then(() => {
                    this.showNotification("PDF 파일이 성공적으로 다운로드되었습니다.", "success");
                }).catch(err => {
                    console.error(err);
                    this.showNotification("PDF 생성 중 오류가 발생했습니다.", "error");
                });
            }

            showNotification(message, type) {
                const toast = document.createElement('div');
                toast.className = `fixed bottom-6 right-6 z-50 px-4 py-3 rounded-xl shadow-2xl text-sm font-medium flex items-center space-x-3 transition-all transform translate-y-2 opacity-0 bg-slate-800 border ${type === 'success' ? 'border-emerald-500 text-emerald-300' : 'border-indigo-500 text-indigo-300'}`;
                toast.innerHTML = `<i class="fa-solid fa-circle-check text-lg"></i><span>${message}</span>`;
                document.body.appendChild(toast);

                setTimeout(() => {
                    toast.classList.remove('translate-y-2', 'opacity-0');
                }, 10);

                setTimeout(() => {
                    toast.classList.add('translate-y-2', 'opacity-0');
                    setTimeout(() => toast.remove(), 300);
                }, 3000);
            }
        }

        const app = new SpeechAnalyzer();
    </script>
</body>
</html>
