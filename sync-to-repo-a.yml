name: Sync Data to Repository A

on:
  push:
    branches:
      - main # 관리자 레파지토리의 main 브랜치에 푸시될 때 작동
    paths:
      - 'archive-data.json' # 관리자 모드에서 저장/백업하는 데이터 파일명 (환경에 맞게 수정)

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository B (Admin)
        uses: actions/checkout@v4

      - name: Checkout Repository A (Visitor)
        uses: actions/checkout@v4
        with:
          repository: '내아이디/레파지토리A이름' # 레파지토리 A의 경로 (예: gildong/zajudan-visitor)
          token: ${{ secrets.GH_PAT }}
          path: repo-a
          ref: main

      - name: Copy and Update Data to Repository A
        run: |
          # 레파지토리 B의 최신 JSON 데이터를 레파지토리 A 내부의 지정된 경로로 복사
          cp archive-data.json repo-a/data/archive-data.json
          
          # 혹은 index.html 자체의 배열 구조를 통째로 교체하고 싶다면 파이썬/노드 스크립트를 활용할 수 있습니다.

      - name: Commit and Push to Repository A
        run: |
          cd repo-a
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          
          git add .
          git diff --quiet && git diff --cached --quiet || (git commit -m "Auto-sync: Update archive data from admin repo" && git push)
